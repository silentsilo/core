[package]
name = "silentsilo-fido"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }
rand = { workspace = true, optional = true }
blake3 = { workspace = true, optional = true }
sha2 = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }
hex = { version = "0.4", optional = true }
ciborium = { version = "0.2", optional = true }
ctap-hid-fido2 = { version = "3.5.12", optional = true }
p256 = { version = "0.14", features = ["ecdh"], optional = true }
hkdf = { version = "0.12", optional = true }
aes = { version = "0.8", optional = true }
cbc = { version = "0.1", optional = true }
hmac = { version = "0.12", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Networking_WindowsWebServices",
    "Win32_System_TpmBaseServices",
    "Win32_UI_WindowsAndMessaging",
] }

# The enclave, reached through Security.framework: the wrapper crate for key
# generation, lookup and agreement, its sys crate for the one call it does
# not wrap (importing a raw public key), Core Foundation for that call's
# attribute dictionary, and LocalAuthentication to ask whether Touch ID can
# answer at all. `OSX_10_15` is the data-protection keychain, the only one
# an enclave key can live in.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7", features = ["OSX_10_15"], optional = true }
security-framework-sys = { version = "2.17", optional = true }
core-foundation = { version = "0.10", optional = true }
objc2-local-authentication = { version = "0.3", optional = true }

[features]
default = ["hardware", "enclave", "ctap2", "passkey"]
hardware = [
    "dep:rand",
    "dep:blake3",
    "dep:sha2",
    "dep:base64",
    "dep:hex",
    "dep:ciborium",
    "dep:ctap-hid-fido2",
]
# The Secure Enclave path. Its key agreement and derivation are pure Rust
# and build everywhere, which is what makes them testable on every platform;
# only the two macOS crates below reach the chip itself. Separate from
# `hardware` so the module can be type-checked for macOS from a machine that
# cannot compile the HID stack's C sources.
enclave = [
    "dep:rand",
    "dep:sha2",
    "dep:hex",
    "dep:p256",
    "dep:hkdf",
    "dep:security-framework",
    "dep:security-framework-sys",
    "dep:core-foundation",
    "dep:objc2-local-authentication",
]

# CTAP2 spoken directly over a link the platform provides: Android's NFC
# and USB. Pure Rust, so it builds and is tested everywhere.
ctap2 = [
    "dep:rand",
    "dep:sha2",
    "dep:p256",
    "dep:hkdf",
    "dep:ciborium",
    "dep:blake3",
    "dep:aes",
    "dep:cbc",
    "dep:hmac",
]

# Passkeys kept in a silo: WebAuthn's authenticator half, for the phone's
# passkey provider.
passkey = [
    "dep:rand",
    "dep:sha2",
    "dep:p256",
    "p256/ecdsa",
    "dep:ciborium",
    "dep:base64",
]

[[example]]
name = "probe_hid"
path = "examples/probe_hid.rs"
required-features = ["hardware"]
