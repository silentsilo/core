[package]
name = "silentsilo-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1"
thiserror = { workspace = true }
silentsilo-core = { workspace = true }
silentsilo-s3 = { workspace = true }
# All three are already in the tree via Tauri and its updater plugin, so the
# WebDAV backend costs no new compilation. `stream` lets a PUT read from a
# file instead of a buffer.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "system-proxy"] }
quick-xml = "0.41"
percent-encoding = "2"
url = "2"
serde = { workspace = true, features = ["derive"] }
# Only to name a target stably; already in the tree everywhere else.
uuid = { workspace = true }
russh = "0.63"
russh-sftp = "2.3"
tokio = { workspace = true, features = ["rt", "net", "time", "fs", "sync", "macros"] }
# Turns a tokio file into the byte stream reqwest's streaming body wants.
tokio-util = { version = "0.7", features = ["io"] }
tempfile = { workspace = true }

# Asking iCloud Drive to download a file it keeps only as a placeholder.
# Already in the tree through the enclave code and Tauri.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSError",
    "NSFileManager",
    "NSString",
    "NSURL",
] }

[dev-dependencies]
serde_json = { workspace = true }
silentsilo-testkit = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
uuid = { workspace = true }
