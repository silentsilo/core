# The WebDAV and SFTP backends the app really talks to, for running the
# suites that skip themselves without one. CI starts the same two; this file
# is so the same tests can run here before a push rather than only after it.
# MinIO has no image any more: scripts/test-local.ps1 builds it from source
# and runs it next to these.
services:
  webdav:
    image: bytemark/webdav
    ports: ["127.0.0.1:8088:80"]
    environment:
      USERNAME: silentsilo
      PASSWORD: silentsilo123

  sftp:
    image: atmoz/sftp:alpine
    ports: ["127.0.0.1:2222:22"]
    # OpenSSH 9.8 and later penalise a source that connects without logging
    # in, which is what reading a host key does, so the suites lock
    # themselves out a few tests in.
    entrypoint: ["/bin/sh", "-c", "echo 'PerSourcePenalties no' >> /etc/ssh/sshd_config && exec /entrypoint silentsilo:silentsilo123:::silo"]
