# The storage backends the app really talks to, for running the suites that
# skip themselves without one. CI starts the same three; this file is so the
# same tests can run here before a push rather than only after it.
services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data
    ports: ["127.0.0.1:9000:9000"]
    environment:
      MINIO_ROOT_USER: silentsilo
      MINIO_ROOT_PASSWORD: silentsilo123
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

  webdav:
    image: bytemark/webdav
    ports: ["127.0.0.1:8088:80"]
    environment:
      USERNAME: silentsilo
      PASSWORD: silentsilo123

  sftp:
    image: atmoz/sftp:alpine
    ports: ["127.0.0.1:2222:22"]
    # OpenSSH 9.8 and later penalise a source that connects without logging
    # in, which is what reading a host key does, so the suites lock
    # themselves out a few tests in.
    entrypoint: ["/bin/sh", "-c", "echo 'PerSourcePenalties no' >> /etc/ssh/sshd_config && exec /entrypoint silentsilo:silentsilo123:::silo"]
